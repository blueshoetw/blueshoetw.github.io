<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>檢舉違規網域 - sbgov.tw</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
<div class="w-full max-w-lg bg-white rounded-2xl shadow p-8 space-y-6">
  <div class="flex justify-between items-center text-sm border-b pb-4">
    <div class="flex items-center space-x-3">
      <a href="./index.html" class="text-slate-400 hover:text-slate-900">首頁</a>
      <a href="./privacy/" class="text-slate-400 hover:text-slate-900">隱私政策</a>
      <a href="./terms/" class="text-slate-400 hover:text-slate-900">使用條款</a>
    </div>
    <div class="space-x-3">
      <a href="./report.html" class="text-slate-900 font-semibold">繁中</a>
      <a href="./report-en.html" class="text-slate-400 hover:text-slate-900">EN</a>
      <a href="./report-zh-cn.html" class="text-slate-400 hover:text-slate-900">简中</a>
    </div>
  </div>

  <div>
    <h1 class="text-2xl font-bold text-red-600">檢舉違規網域</h1>
    <p class="text-sm text-slate-500 mt-1">若發現濫用、釣魚或違反條款之網域，請在此回報。</p>
  </div>

  <div class="flex gap-4 border-b">
    <button id="tab-report" class="px-3 py-2 border-b-2 border-slate-900 font-semibold">填寫檢舉單</button>
    <button id="tab-report-status" class="px-3 py-2 text-slate-400">查詢進度</button>
  </div>

  <div id="panel-report" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">違規子網域</label>
      <div class="flex items-center gap-2">
        <input id="report-sub" class="flex-1 border rounded-lg px-3 py-2" placeholder="mysite">
        <span class="text-slate-500">.sbgov.tw</span>
      </div>
    </div>
    
    <div>
      <label class="block text-sm font-medium mb-1">違規原因</label>
      <textarea id="report-reason" rows="3" class="w-full border rounded-lg px-3 py-2" placeholder="請描述具體違規行為"></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">您的聯繫方式（選填）</label>
      <input id="report-contact" class="w-full border rounded-lg px-3 py-2" placeholder="Email / Discord">
    </div>

    <div id="report-turnstile"></div>
    <button id="report-go" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg shadow-lg hover:shadow-xl transform transition-all duration-200 hover:-translate-y-0.5 animate-pulse font-bold tracking-wider">送出檢舉</button>
    <p id="report-msg" class="text-sm min-h-[1.25rem] mt-2"></p>
  </div>

  <div id="panel-report-status" class="space-y-4 hidden">
    <div>
      <label class="block text-sm font-medium mb-1">請輸入檢舉碼</label>
      <input id="rstatus-code" class="w-full border rounded-lg px-3 py-2 font-mono uppercase" placeholder="RPT-XXXXXXXX">
    </div>
    <div id="report-status-turnstile"></div>
    <button id="rstatus-go" class="w-full bg-slate-900 text-white py-2 rounded-lg hover:bg-slate-700">查詢進度</button>
    <div id="rstatus-out" class="text-sm space-y-1"></div>
  </div>
</div>

<script src="./assets/common.js?v=4"></script>
<script>
  SBGOV.initTurnstile();
  
  document.getElementById("tab-report").onclick = () => {
    document.getElementById("panel-report").classList.remove("hidden");
    document.getElementById("panel-report-status").classList.add("hidden");
    document.getElementById("tab-report").classList.add("border-b-2", "border-slate-900", "font-semibold");
    document.getElementById("tab-report").classList.remove("text-slate-400");
    document.getElementById("tab-report-status").classList.remove("border-b-2", "border-slate-900", "font-semibold");
    document.getElementById("tab-report-status").classList.add("text-slate-400");
  };
  
  document.getElementById("tab-report-status").onclick = () => {
    document.getElementById("panel-report").classList.add("hidden");
    document.getElementById("panel-report-status").classList.remove("hidden");
    document.getElementById("tab-report-status").classList.add("border-b-2", "border-slate-900", "font-semibold");
    document.getElementById("tab-report-status").classList.remove("text-slate-400");
    document.getElementById("tab-report").classList.remove("border-b-2", "border-slate-900", "font-semibold");
    document.getElementById("tab-report").classList.add("text-slate-400");
  };

  SBGOV.bindReport({
    loading: "傳送中…",
    success: "檢舉已送出！檢舉碼：",
    fail: "傳送失敗",
    waitTurnstile: "請先完成人機驗證！",
    alertEmpty: "請填寫違規子網域與原因！",
    alertSuccess: "檢舉已送出！\n\n您的檢舉碼是：{code}\n請務必記下這組號碼，以便日後查詢進度。",
    alertFail: "提交失敗："
  });
  
  SBGOV.bindReportStatus({
    loading: "查詢中…",
    waitTurnstile: "請先完成人機驗證！",
    alertEmpty: "請輸入檢舉碼",
    codeLabel: "檢舉碼",
    statusLabel: "目前進度",
    pendingMsg: "等待管理員處理",
    resolvedMsg: "已處理完畢",
    timeLabel: "送出時間",
    replyLabel: "管理員回覆",
    deleteMsg: "系統將於 2 天後自動刪除此紀錄。"
  });
</script>
</body>
</html>
