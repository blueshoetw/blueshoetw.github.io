<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>檢舉違規網域 - sbgov.tw</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
<div class="w-full max-w-lg bg-white rounded-2xl shadow p-8 space-y-6">
  <div class="flex justify-between items-center text-sm border-b pb-4">
    <div class="flex items-center space-x-3">
      <a href="./index.html" class="text-slate-400 hover:text-slate-900">首頁</a>
      <a href="./privacy/" class="text-slate-400 hover:text-slate-900">隱私政策</a>
      <a href="./terms/" class="text-slate-400 hover:text-slate-900">使用條款</a>
    </div>
    <div class="space-x-3">
      <a href="./report.html" class="text-slate-900 font-semibold">繁中</a>
      <a href="./report-en.html" class="text-slate-400 hover:text-slate-900">EN</a>
      <a href="./report-zh-cn.html" class="text-slate-400 hover:text-slate-900">简中</a>
    </div>
  </div>

  <div>
    <h1 class="text-2xl font-bold text-red-600">檢舉違規網域</h1>
    <p class="text-sm text-slate-500 mt-1">若發現濫用、釣魚或違反條款之網域，請在此回報。</p>
  </div>

  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">違規子網域</label>
      <div class="flex items-center gap-2">
        <input id="report-sub" class="flex-1 border rounded-lg px-3 py-2" placeholder="mysite">
        <span class="text-slate-500">.sbgov.tw</span>
      </div>
    </div>
    
    <div>
      <label class="block text-sm font-medium mb-1">違規原因</label>
      <textarea id="report-reason" rows="3" class="w-full border rounded-lg px-3 py-2" placeholder="請描述具體違規行為（如：釣魚、詐騙、惡意軟體等）"></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">您的聯繫方式（選填）</label>
      <input id="report-contact" class="w-full border rounded-lg px-3 py-2" placeholder="Email / Discord（方便我們通知您處理結果）">
    </div>

    <div id="report-turnstile"></div>
    <button id="report-go" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg shadow-lg hover:shadow-xl transform transition-all duration-200 hover:-translate-y-0.5 animate-pulse font-bold tracking-wider">送出檢舉</button>
    <!-- 確保這裡的 msg 有加上 mt-2 讓它不會太擠 -->
    <p id="report-msg" class="text-sm min-h-[1.25rem] mt-2"></p>
  </div>
</div>

<script src="./assets/common.js"></script>
<script>
  SBGOV.initTurnstile();
  SBGOV.bindReport({
    loading: "傳送中…",
    success: "檢舉已送出，感謝您的回報",
    fail: "傳送失敗",
    waitTurnstile: "請先完成上方的人機驗證！",
  });
</script>
</body>
</html>
