<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>申请 sbgov.tw 子网域</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
<div class="w-full max-w-lg bg-white rounded-2xl shadow p-8 space-y-6">
  
  <div class="flex justify-between items-center text-sm border-b pb-4">
    <div class="flex items-center space-x-4">
      <a href="./privacy/" class="text-slate-400 hover:text-slate-900">隐私政策</a>
      <a href="./terms/" class="text-slate-400 hover:text-slate-900">使用条款</a>
      <a href="./report-zh-cn.html" class="text-red-600 hover:text-red-800 font-bold">举报</a>
    </div>
    <div class="space-x-3">
      <a href="./index.html" class="text-slate-400 hover:text-slate-900">繁中</a>
      <a href="./index-en.html" class="text-slate-400 hover:text-slate-900">EN</a>
      <a href="./index-zh-cn.html" class="text-slate-900 font-semibold">简中</a>
    </div>
  </div>

  <a href="./report-zh-cn.html" class="block bg-red-50 border-l-4 border-red-600 p-4 rounded-r-lg hover:bg-red-100 transition group">
    <div class="flex justify-between items-center">
      <div>
        <p class="text-sm font-bold text-red-800">发现滥用、钓鱼或违规网域？</p>
        <p class="text-xs text-red-600 mt-1">若发现任何违反使用条款的行为，请协助我们举报。</p>
      </div>
      <span class="bg-red-600 text-white px-4 py-2 rounded shadow font-bold text-sm whitespace-nowrap ml-4 group-hover:bg-red-700 transition">前往举报</span>
    </div>
  </a>

  <div>
    <h1 class="text-2xl font-bold">申请免费子网域</h1>
    <p class="text-sm text-slate-500 mt-1">导向你的 GitHub Pages（*.github.io）</p>
  </div>

  <div class="flex gap-4 border-b">
    <button id="tab-apply" class="px-3 py-2 border-b-2 border-slate-900 font-semibold">申请</button>
    <button id="tab-status" class="px-3 py-2 text-slate-400">查询</button>
  </div>

  <div id="panel-apply" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">子网域</label>
      <div class="flex items-center gap-2">
        <input id="apply-sub" class="flex-1 border rounded-lg px-3 py-2" placeholder="mysite">
        <span class="text-slate-500">.sbgov.tw</span>
      </div>
    </div>
    
    <div>
      <label class="block text-sm font-medium mb-1">GitHub Pages 目标</label>
      <input id="apply-tgt" class="w-full border rounded-lg px-3 py-2" placeholder="username.github.io">
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">联系方式（强烈建议填写）</label>
      <!-- 修改了這裡的提示文字 -->
      <input id="apply-contact" class="w-full border rounded-lg px-3 py-2" placeholder="例如：Discord: user#1234 / Email: mail@example.com">
      <p class="text-red-500 text-xs mt-1 leading-relaxed">
        提示：若未提供有效联系方式，可能导致审核无法通过；日后若发生违规且无法联系您，该网域将被直接暂停使用。
      </p>
    </div>

    <div class="flex items-start gap-2 mt-2">
      <input type="checkbox" id="apply-agree" class="mt-1 w-4 h-4 cursor-pointer">
      <label for="apply-agree" class="text-sm text-slate-600 cursor-pointer select-none">
        我已阅读并同意 <a href="./terms/" target="_blank" class="text-blue-600 underline hover:text-blue-800">服务条款</a> 与 <a href="./privacy/" target="_blank" class="text-blue-600 underline hover:text-blue-800">隐私政策</a>
      </label>
    </div>

    <div id="apply-turnstile"></div>
    <button id="apply-go" class="w-full bg-slate-900 text-white py-2 rounded-lg hover:bg-slate-700">提交申请</button>
    <p id="apply-msg" class="text-sm min-h-[1.25rem]"></p>
  </div>

  <div id="panel-status" class="space-y-4 hidden">
    <div>
      <label class="block text-sm font-medium mb-1">子网域</label>
      <div class="flex items-center gap-2">
        <input id="status-sub" class="flex-1 border rounded-lg px-3 py-2" placeholder="mysite">
        <span class="text-slate-500">.sbgov.tw</span>
      </div>
    </div>
    <div id="status-turnstile"></div>
    <button id="status-go" class="w-full bg-slate-900 text-white py-2 rounded-lg hover:bg-slate-700">查询</button>
    <div id="status-out" class="text-sm space-y-1"></div>
  </div>
</div>

<script src="./assets/common.js?v=5"></script>
<script>
  SBGOV.initTurnstile();
  SBGOV.setupTabs();
  SBGOV.bindApply({
    loading: "提交中…",
    success: "已提交，等待审核",
    fail: "提交失败",
    waitTurnstile: "请先完成人机验证",
    alertAgree: "请先勾选同意服务条款与隐私政策",
  });
  SBGOV.bindStatus({
    loading: "查询中…",
    subdomainLabel: "子网域",
    statusLabel: "状态",
    blockedLabel: "此子网域已被封禁",
    reasonLabel: "原因",
    timeLabel: "申请时间",
    waitTurnstile: "请先完成人机验证",
    labels: {
      pending:  ["审核中", "text-yellow-600"],
      approved: ["已通过，日后会不定期检查页面是否有违反使用条款，感谢您的使用。", "text-green-600"],
      rejected: ["已拒绝，2天后将删除该记录，请重新申请。", "text-red-600"],
    },
  });
</script>
</body>
</html>
